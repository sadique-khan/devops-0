name: CI/CD - Build & Deploy to Codespace

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sadique-khan/devops-0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-codespace:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy inside Codespace
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          # 1. Find the name of the active codespace for this repo
          CODESPACE_NAME=$(gh codespace list --repo ${{ github.repository }} --json name -q '.[0].name')
          
          if [ -z "$CODESPACE_NAME" ] || [ "$CODESPACE_NAME" = "null" ]; then
            echo "No running Codespace found for this repository. Skipping deployment."
            exit 0
          fi

          echo "Deploying to active codespace: $CODESPACE_NAME"

          # 2. Execute docker redeploy commands inside the codespace via SSH
          gh codespace ssh -c "$CODESPACE_NAME" -- "
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest && \
            docker stop my-app || true && \
            docker rm my-app || true && \
            docker run -d --name my-app -p 3000:3000 ghcr.io/${{ env.IMAGE_NAME }}:latest
          "