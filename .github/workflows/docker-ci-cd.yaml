name: CI/CD - Build & Deploy to Codespace

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sadique-khan/devops-0
  CODESPACE_NAME: reimagined-memory-vwx6g5rx759fxvww

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-codespace:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Codespace and Run Container
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          echo "Connecting to Codespace: ${{ env.CODESPACE_NAME }}"

          gh codespace ssh -c "${{ env.CODESPACE_NAME }}" -- "
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest && \
            docker stop my-app 2>/dev/null || true && \
            docker rm my-app 2>/dev/null || true && \
            docker run -d --name my-app -p 3000:3000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          "